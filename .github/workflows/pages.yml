name: Deploy to GitHub Pages

# Publishes the app so it can be opened on a phone and embedded in Notion.
# `enablement: true` turns Pages on automatically the first time this runs,
# so the repo needs no manual Settings changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify math generators and question bank
        run: node test/run.js
      - name: Verify the bundle rebuilds cleanly
        run: |
          node build.js
          git diff --exit-code dist/ || {
            echo "dist/ is out of date — run 'node build.js' and commit the result."
            exit 1
          }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
